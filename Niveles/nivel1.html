<!DOCTYPE html>
<html>

<head>
    <title> NIVEL 1 </title>

    <link rel="stylesheet" href="../css/styleNivel1.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

</head>

<body>
    <div class="bordeOscuro" aria-hidden="true"></div>

    <div class="lineasHorizontales" aria-hidden="true"></div>

    <!-- Una caja que contendra una imagen de fondo -->
    <div class="ventanaNivel" aria-hidden="true"></div>

    <!-- Una caja que contendra una imagen de fondo, texto y una barra de progeso con otro div -->
    <div class="ventanaSecundaria" aria-hidden="true">
        <p>
            Dificultad - Facil
            <br>
            Limite de tiempo: 60s 
            <br>
            Cant. enemigos: 10
            <br>
            Tiempo record: 30s
        </p>

        <!-- Barra de progeso -->
        <!-- Opciones que utilizaremos para JS -->
        <!-- progressbar les dice a los lectores de pantalla que este elemento no es un div generico, sino una barra de progreso -->
        <!-- aria-valuenow = porcentaje del width del relleno. Es el valor actual de la barra, en el que se usa para anunciar el progreso -->
        <!-- aria-valuemin Indica el minimo del rango -->
        <!-- aria-valuemax Indica el maximo del rango -->
        <!-- aria-lavel es el nombre accesible de la barra -->
        <div class="barraProgreso" 
            role="progressbar"
            aria-valuenow="100"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Progreso del Nivel 1">

            <!-- <span> esta etiqueta inline nos permite contener el relleno del progreso y es mas liviana que un div -->
            <!-- style="width" nos indica que porcentaje del progreso llevamos(es lo pintado de la barra)  -->
            <span class="barraProgreso-relleno" style="width: 67.67%;"> 67.67% </span>
        </div>
    </div>

    <section>

        <article class="panelPrincipal">
            
            <a class="volver" href="../index.html"> Volver </a>

            <h3> Nivel 1 - ¿Dónde estoy? </h3>

            <image class="imgTitulo" src="../Imagenes/Niveles/espacio.jpg" width="400" high="400" />

            <p class="descripcion"> 
                Acá va una descripcion. Acá va una descripcion. Acá va una descripcion. 
            </p> 

            <a class="jugar"> Jugar </a>

        </article>
    </section>
</body>

</html>
